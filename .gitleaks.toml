# The secret scan of CI (job `secrets` of .github/workflows/verify.yml).
#
# gitleaks' default rules, none removed. This file only adds exceptions, and
# is the only place they live: no inline allow comment, no
# .gitleaksignore (CI refuses both). An exception is read here, in review,
# with its reason.

title = "Crewdeck"

[extend]
useDefault = true

[[allowlists]]
description = "Test vectors of the end-to-end encryption (E2E-1)"
# Keys and ciphertexts shared by the TypeScript and Go tests: generated for
# the tests, never a real key. Only this folder, never a wider pattern.
paths = [
  '''^packages/contracts/fixtures/crypto/''',
]


[[allowlists]]
description = "Fake values of the log redaction test (CORE-1, SEC-7)"
# apps/server/src/logging/redact.spec.ts sends these values in a request and
# asserts none reaches the logs: made up, never a real credential. Only the
# values shaped `secret-<words>-<4 hex>` are excepted, not the file: a path in
# a global allowlist would skip every rule on it.
regexTarget = "secret"
regexes = [
  '''^secret-[a-z-]+-[0-9a-f]{4}$''',
]

[[allowlists]]
description = "Fake secret of a link code in the tests of the Runner's link (RUNNER-3)"
# The tests of the contracts, the page and `crewdeck-runner link` share this
# made-up secret of 26 Crockford characters: never a real code (a real one is
# drawn by the page and never written anywhere). The tests of the link's
# proofs (E2E-2) end it in G, so that it decodes to exactly 16 bytes. Only
# these two exact values are excepted, not the files.
regexTarget = "secret"
regexes = [
  '''^M2PXA7QK9VZ3T8W4R6N1B5C0D[EG]$''',
]

[[allowlists]]
description = "Public key of a test vector in the tests of the pairing schemas (E2E-2)"
# recipientPublicKey of packages/contracts/fixtures/crypto/crewdeck-wrap.json
# (a vector generated for the tests, a public key): the schema tests of
# packages/contracts reuse it as a well-formed 32-byte key. Only this exact
# value is excepted, not the files.
regexTarget = "secret"
regexes = [
  '''^Yfery35HM-eYbPAm7LdhTYCeN5erL97LmNKhUPk930U$''',
]

[[allowlists]]
description = "Made-up keys of a push subscription in the tests of the push notifications (ATOI-4)"
# The page's and the contracts' tests use the sample VAPID public key of the
# web-push documentation, and a browser's subscription keys made up for the
# tests: p256dh is a public key, auth a fake 16-byte secret no push service
# ever saw. Only these exact values are excepted, not the files.
regexTarget = "secret"
regexes = [
  '''^BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U$''',
  '''^BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM$''',
  '''^tBHItJI5svbpez7KI4CCXg$''',
]

[[allowlists]]
description = "Vault key of a test vector in the test vault of the e2e scenarios (PARAM-3)"
# vaultKey of packages/contracts/fixtures/crypto/item.json (a vector generated
# for the tests, never a real key): apps/server/src/testing/test-vault.ts
# gives it to the trusted test Appareil of the scenarios that open the vault.
# Only this exact value is excepted, not the file.
regexTarget = "secret"
regexes = [
  '''^M2R0Pfnf_rCBjvV-kIOBd7R_TFqX_nbyO6MM7Siy8oI$''',
]

[[allowlists]]
description = "Fake access token of Google's token endpoint in the tests of its client (CORE-10)"
# apps/server/src/auth/google/google.client.spec.ts answers it from msw's
# fake token endpoint: made up, never a real token (the client never keeps
# it). Only this exact value is excepted, not the file.
regexTarget = "secret"
regexes = [
  '''^ya29\.never-kept$''',
]

[[allowlists]]
description = "Fake secret of a new Appareil's code in the tests of its approval (E2E-3)"
# The tests of the page's approval (keys, the dialogs, the e2e of the
# Appareils) share this made-up secret of 26 Crockford characters, the
# alphabet in order: never a real code (a real one is drawn by the new
# Appareil and never written anywhere). Only this exact value is excepted,
# not the files.
regexTarget = "secret"
regexes = [
  '''^ABCDEFGHJKMNPQRSTVWXYZ0120$''',
]
