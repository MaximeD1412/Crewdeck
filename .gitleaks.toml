# The secret scan of CI (job `secrets` of .github/workflows/verify.yml).
#
# gitleaks' default rules, none removed. This file only adds exceptions, and
# is the only place they live: no inline allow comment, no
# .gitleaksignore (CI refuses both). An exception is read here, in review,
# with its reason.

title = "Crewdeck"

[extend]
useDefault = true

[[allowlists]]
description = "Test vectors of the end-to-end encryption (E2E-1)"
# Keys and ciphertexts shared by the TypeScript and Go tests: generated for
# the tests, never a real key. Only this folder, never a wider pattern.
paths = [
  '''^packages/contracts/fixtures/crypto/''',
]

