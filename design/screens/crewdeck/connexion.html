<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<script defer src="../../components.js"></script>
<style>
.hero { padding-top: var(--space-10); }
.hero .muted { color: var(--muted); }
.or { display: flex; align-items: center; gap: var(--space-3); color: var(--muted); font: var(--font-caption-weight) var(--font-caption-size)/var(--font-caption-line-height) var(--font-caption-family), sans-serif; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<ui-app-shell variant="bare" screen="Connexion">
  <section class="hero stack" aria-label="Connexion / Bienvenue" data-name="Connexion / Bienvenue">
    <h1 class="page-title">Bienvenue sur Crewdeck</h1>
    <p class="text-sm">Pilote tes Projets avec des agents IA, de l’Idée au Ticket livré, en temps réel.</p>
    <div class="stack-sm">
      <ui-text-field label="Ton adresse email"></ui-text-field>
      <ui-button variant="primary" icon="send" wide>Recevoir un lien de connexion</ui-button>
    </div>
    <div class="or">ou</div>
    <div class="stack-sm">
      <ui-button icon="google" wide>Continuer avec Google</ui-button>
      <ui-button icon="github" wide>Continuer avec GitHub</ui-button>
    </div>
    <p class="muted text-sm">Aucun mot de passe de plus à retenir, et pas besoin d’un compte GitHub.</p>
  </section>
</ui-app-shell>
</body>
</html>
