<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<!-- exemple : état de préparation fictif -->
<ui-app-shell screen="Site mairie" current="projets" decisions="9" ideas="4" designs="2" loops="2">
  <ui-page-header title="Site mairie" back="Projets" count="1 point à régler">
    <ui-button icon="layers">Gestion du process</ui-button>
    <ui-button icon="settings">Paramètres du Projet</ui-button>
  </ui-page-header>
  <ui-banner tone="caution" icon="alert" title="Le Process ne peut pas démarrer">Il manque la branche d’intégration develop. « Corriger » la crée sur GitHub en un clic ; les Tickets attendent qu’elle existe.</ui-banner>
  <div class="layout">
    <ui-card title="Ce dont le Process a besoin" label="Site mairie / Préparation" flush>
      <ui-list-row icon="alert" tone="caution" title="Branches d’intégration et de release" meta="main présente · develop absente : « Corriger » la crée depuis main"><ui-button size="sm" variant="primary">Corriger</ui-button></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Runner relié" meta="en ligne · atelier-pc"><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Un Moteur utilisable par Rôle" meta="Idée, Conception : Claude Code · Code : Codex · Review : Claude Code"><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Labels" meta="labels du Process présents sur GitHub"><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Process" meta="v3 active · aucun Manque · parti du Modèle « Process Crewdeck »" link><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Paramètres du Process sur GitHub" meta=".process.json présent"><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
      <ui-list-row icon="check" tone="go" title="Inventaire approuvé" meta="approuvé le 3 nov."><ui-status-badge tone="go">ok</ui-status-badge></ui-list-row>
    </ui-card>
    <div class="layout-aside">
      <ui-card title="Projet" label="Site mairie / Projet">
        <ui-key-value>
          <ui-kv label="GitHub">MaximeD1412/site-mairie</ui-kv>
          <ui-kv label="Suivi depuis">3 nov.</ui-kv>
          <ui-kv label="Paramètres">hérités du compte, 3 modifiés</ui-kv>
        </ui-key-value>
      </ui-card>
    </div>
  </div>
</ui-app-shell>
